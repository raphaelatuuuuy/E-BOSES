# ============================================================
# E-Boses — Docker Compose
# ============================================================
version: "3.9"

services:
  # --------------------------------------------------
  # PostgreSQL + PostGIS
  # --------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: eboses-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eboses}
      POSTGRES_USER: ${POSTGRES_USER:-eboses_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eboses_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/database/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eboses_user} -d ${POSTGRES_DB:-eboses}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------
  # Redis
  # --------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eboses-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------
  # Django API
  # --------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: eboses-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./apps/api:/app
      - api_media:/app/media
      - api_static:/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # --------------------------------------------------
  # React + Vite Frontend
  # --------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: eboses-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:5173"
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000/ws}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  api_media:
  api_static:
