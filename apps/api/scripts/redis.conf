# E-Boses local Redis production configuration.
# Runs on the LAN server only (bind 127.0.0.1), so nothing on the network
# can reach it. Everything shares DB 0: Django cache, Celery broker/results
# and Channels all point at REDIS_URL/CACHE_REDIS_URL (/0) so a beat task
# that clears a cache key is picked up by web requests immediately.
#
# Windows binary: https://github.com/tporadowski/redis (v5.0.14.1).
# Started by scripts\start-redis.ps1 (wired into the "E-Boses Celery"
# scheduled task so it comes back automatically after a reboot).

bind 127.0.0.1
port 6379

dir "C:/Users/TO GOD BE THE GLORY/redis/data"
pidfile "C:/Users/TO GOD BE THE GLORY/redis/data/redis.pid"
logfile "C:/Users/TO GOD BE THE GLORY/redis/data/redis.log"

# Durability: AOF fsynced every second so queued OCR tasks and Channels
# tickets survive a power loss / reboot (RDB snapshots kept as a fallback).
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Cache keys all carry TTLs, so volatile-lru evicts caches before ever
# touching broker/Channels keys under memory pressure.
maxmemory 512mb
maxmemory-policy volatile-lru

databases 16
