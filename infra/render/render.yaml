# ============================================================
# E-Boses — Render Deployment Configuration
# ============================================================
# https://render.com/docs/infrastructure-as-code

services:
  # ---- Web Service (Django API) ----
  - type: web
    name: eboses-api
    env: python
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: POSTGRES_HOST
        fromDatabase:
          name: eboses-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: eboses-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: eboses-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: eboses-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: eboses-db
          property: password
      - key: REDIS_URL
        fromService:
          name: eboses-redis
          type: redis
          property: connectionString

  # ---- Static Site (React Frontend) ----
  - type: web
    name: eboses-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://eboses-api.onrender.com/api/v1
      - key: VITE_WS_BASE_URL
        value: wss://eboses-api.onrender.com/ws

databases:
  # ---- PostgreSQL + PostGIS ----
  - name: eboses-db
    databaseName: eboses
    ipAllowList: []
    postgresMajorVersion: 16

redis:
  # ---- Redis ----
  - name: eboses-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
