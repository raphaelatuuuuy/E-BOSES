services:
  - type: web
    name: eboses-api
    runtime: python
    rootDir: apps/api
    buildCommand: bash build.sh
    startCommand: python -m daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: ENABLE_GIS
        value: "false"
      - key: STORAGE_BACKEND
        value: cloudinary
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: TRUST_X_FORWARDED_PROTO
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # Secrets are dashboard-managed (sync: false) — never commit values.
      # Fill them in Render → eboses-api → Environment before first deploy.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: JWT_SIGNING_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: CACHE_REDIS_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SMS_GATE_BASE_URL
        sync: false
      - key: SMS_GATE_USERNAME
        sync: false
      - key: SMS_GATE_PASSWORD
        sync: false
      - key: OUTBOUND_SMS_DRIVER
        sync: false
      - key: SMS_GATE_SIM_NUMBER
        value: "2"
      - key: OUTBOUND_SMS_SIM_SLOT
        value: "2"
      - key: SMS_INBOUND_WEBHOOK_TOKEN
        sync: false
      - key: SMS_GATE_WEBHOOK_SIGNING_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OCRSPACE_API_KEY
        sync: false
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ASSISTANT_ENABLED
        value: "true"
      - key: ASSISTANT_BASE_URL
        value: https://inference.poolside.ai/v1
      - key: ASSISTANT_MODEL
        value: poolside/laguna-xs-2.1
      - key: ASSISTANT_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: IP2GEO_API_KEY
        sync: false
      - key: IP2GEO_API_URL
        sync: false

  # Paid path (free tier runs workers on your laptop instead — see Phase 5).
  # Uncomment when off free tier: one service per role, same envVars as above.
