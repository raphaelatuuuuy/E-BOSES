name: Docker CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t eboses-api ./apps/api

      - name: Build Web image
        run: docker build -t eboses-web ./apps/web

      - name: Verify Docker Compose
        run: docker compose config
